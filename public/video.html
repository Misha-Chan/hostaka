<!DOCTYPE html>
<html class="page-video" lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<link rel="icon" href="hostaka-icon.png" type="image/png">
<title>Hostaka Video</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css?v=2">
<link rel="stylesheet" href="/style.css?v=2">
<script src="/i18n.js?v=3"></script>
<script src="/dialogs.js?v=1"></script>
</head>
<body class="page-video">

<div class="loader" id="loader"><div class="spinner"></div></div>

<div class="topbar">
  <a href="/" class="back-btn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <div class="topbar-title video-brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="15" height="14" rx="3"/><polygon points="17 9 22 6 22 18 17 15" fill="currentColor" stroke="none"/></svg>
    <span data-i18n="video.title">Hostaka Video</span>
  </div>
  <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" data-i18n-title="common.toggleTheme" title="Toggle theme">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
</div>

<div class="video-page-wrap" id="videoPageWrap">
  <div style="text-align:center;padding:60px;color:var(--muted);" data-i18n="common.loading">Loading...</div>
</div>

<div id="toastHost"></div>

<script src="/script.js?v=2" defer></script>
</body>
</html>
