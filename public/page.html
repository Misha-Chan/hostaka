<!DOCTYPE html>
<html class="page-page" lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="hostaka-icon.png" type="image/png">
<title data-i18n="page.pageTitle">Hostaka — Page</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="/page.css">
<script src="/i18n.js"></script>
<script src="/modal.js"></script>
</head>
<body class="page-page">

<div class="topbar">
  <button class="back-btn" onclick="location.href='/'">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <span class="topbar-title" data-i18n="page.title">Page</span>
</div>

<div id="content">
  <div class="loader-wrap"><div class="spinner"></div></div>
</div>

<div class="modal-bg" id="editPageModal">
  <div class="modal-box">
    <div class="modal-title" data-i18n="page.editPage">Edit Page</div>
    <div class="err" id="editPageErr"></div>
    <div class="field"><label data-i18n="page.pageName">Page name</label><input type="text" id="epName" maxlength="60"></div>
    <div class="field"><label data-i18n="page.category">Category</label><input type="text" id="epCategory" maxlength="40" placeholder="Gaming, Tech, Art..." data-i18n-placeholder="page.categoryPlaceholder"></div>
    <div class="field"><label data-i18n="page.bio">Bio</label><textarea id="epBio" maxlength="300"></textarea></div>
    <input type="file" id="epAvatarFile" accept="image/*" style="display:none;" onchange="onEditAvatar(event)">
    <input type="file" id="epCoverFile" accept="image/*" style="display:none;" onchange="onEditCover(event)">
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeEditPage()" data-i18n="common.cancel">Cancel</button>
      <button class="btn btn-ghost" onclick="document.getElementById('epAvatarFile').click()" data-i18n="page.changeAvatar">Change avatar</button>
      <button class="btn btn-ghost" onclick="document.getElementById('epCoverFile').click()" data-i18n="page.changeCover">Change cover</button>
      <button class="btn btn-primary" id="epSaveBtn" onclick="savePageEdit()" data-i18n="common.save">Save</button>
    </div>
  </div>
</div>

  <script src="/shared.js" defer></script>
  <script src="/page.js" defer></script>
</body>
</html>
