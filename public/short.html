<!DOCTYPE html>
<html class="page-short" lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="hostaka-icon.png" type="image/png">
<title data-i18n="short.pageTitle">Hostaka — Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=El+Messiri:wght@400..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="/short.css">
<script src="/i18n.js"></script>
<script src="/modal.js"></script>
</head>
<body class="page-short">

<div class="loader" id="loader"><div class="spinner"></div></div>

<div class="topbar">
  <button class="back-btn" onclick="location.href='/'">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="topbar-title">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2.5"/><polygon points="10.5 9.5 15 12 10.5 14.5" fill="currentColor" stroke="none"/></svg>
    <span data-i18n="short.title">Reels</span>
  </div>
  <div style="width:38px;"></div>
</div>

<div class="reels-feed" id="reelsFeed"></div>

<div class="comments-sheet-bd" id="commentsSheetBd" onclick="if(event.target===this) closeComments();">
  <div class="comments-sheet">
    <div class="comments-head">
      <span id="commentsCount" data-i18n="short.comments">Comments</span>
      <button onclick="closeComments()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="comments-list" id="commentsList"></div>
    <div class="comments-input-row">
      <input type="text" id="commentInput" placeholder="Add a comment..." data-i18n-placeholder="short.addComment" maxlength="500" onkeydown="if(event.key==='Enter') sendReelComment();">
      <button type="button" class="femoji-comment-btn" data-target="commentInput" title="Emoji" style="background:none;border:none;cursor:pointer;font-size:1.1rem;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px;"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></button>
      <button onclick="sendReelComment()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

  <script src="/shared.js" defer></script>
  <script src="/short.js" defer></script>
  <script src="/themes.js" defer></script>
</body>
</html>
